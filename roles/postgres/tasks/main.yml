- name: Configure PostgreSQL
  become: true
  block:
    - name: Install base packages
      ansible.builtin.apt:
        name:
          - postgresql-common
          - python3-psycopg2
          - acl
        update_cache: true
        state: present

    - name: Disable default cluster creation
      ansible.builtin.lineinfile:
        path: /etc/postgresql-common/createcluster.conf
        regexp: "^#?create_main_cluster\\s*="
        line: "create_main_cluster = false"

    - name: Install PostgreSQL package
      ansible.builtin.apt:
        name: "postgresql-{{ __pg_version }}"
        state: present

    - name: Create root data directory
      ansible.builtin.file:
        path: "{{ __root_dir }}"
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Create postgres directory
      ansible.builtin.file:
        path: "{{ postgres__data_dir | dirname }}"
        state: directory
        owner: postgres
        group: postgres
        mode: "0700"

    - name: Create data directory
      ansible.builtin.file:
        path: "{{ postgres__data_dir }}"
        state: directory
        owner: postgres
        group: postgres
        mode: "0700"

    - name: Init database cluster
      ansible.builtin.command:
        cmd: "{{ __pg_bin_dir }}/pg_ctl initdb -D {{ postgres__data_dir }}"
        creates: "{{ postgres__data_dir }}/PG_VERSION"
      become_user: postgres

    - name: Configure postgresql.conf
      ansible.builtin.lineinfile:
        path: "{{ postgres__data_dir }}/postgresql.conf"
        regexp: "^#?{{ item.key | regex_escape() }}\\s*="
        line: "{{ item.key }} = {{ item.value }}"
        create: false
      loop: "{{ postgres__opts | dict2items }}"
      loop_control:
        label: "{{ item.key }}"
      notify:
        - Restart PostgreSQL

    - name: Configure pg_hba.conf
      ansible.builtin.template:
        src: pg_hba.conf.j2
        dest: "{{ postgres__data_dir }}/pg_hba.conf"
        owner: postgres
        group: postgres
        mode: "0600"
      notify:
        - Reload PostgreSQL

    - name: Copy PostgreSQL systemd service
      ansible.builtin.template:
        src: postgres.service.j2
        dest: "/etc/systemd/system/{{ __service_name }}.service"
        owner: root
        group: root
        mode: "0644"
      notify:
        - Daemon reload
        - Restart PostgreSQL

    - name: Enable PostgreSQL service now
      ansible.builtin.systemd_service:
        name: "{{ __service_name }}.service"
        enabled: true
        state: started

- name: Flush handlers
  ansible.builtin.meta: flush_handlers

- name: Check PostgreSQL
  community.postgresql.postgresql_query:
    login_db: postgres
    query: SELECT 1
  become: true
  become_user: postgres
  register: __result
  until: __result is succeeded
  retries: 6
  delay: 5
  changed_when: false

- name: Create users
  community.postgresql.postgresql_user:
    name: "{{ item.name }}"
    password: "{{ item.password | default(omit) }}"
    update_password: on_create
    role_attr_flags: "{{ item.role_attr_flags | default(omit) }}"
    state: "{{ item.state | default(omit) }}"
  loop: "{{ postgres__users }}"
  loop_control:
    label: "{{ item.name }}"
  become: true
  become_user: postgres
  no_log: true

- name: Create databases
  community.postgresql.postgresql_db:
    name: "{{ item.name }}"
    owner: "{{ item.owner | default(omit) }}"
    encoding: "{{ item.encoding | default(omit) }}"
    state: "{{ item.state | default(omit) }}"
  loop: "{{ postgres__databases }}"
  loop_control:
    label: "{{ item.name }}"
  become: true
  become_user: postgres
